<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babylon.js Knife Viewer</title>
  <style>
    body, html { 
      margin:0; 
      padding:0; 
      height:100%; 
      overflow:hidden; 
      background:#1a1a1a; 
    }
    #renderCanvas { 
      width:100%; 
      height:100%; 
      display:block; 
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

  <script>
    window.addEventListener("load", async () => {
      const canvas = document.getElementById("renderCanvas");
      const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
      
      const scene = new BABYLON.Scene(engine);
      
      // Transparent background
      scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);

      // Camera
      const camera = new BABYLON.ArcRotateCamera(
        "camera", 
        Math.PI / 1.6, 
        Math.PI / 2.3, 
        5, 
        BABYLON.Vector3.Zero(), 
        scene
      );
      camera.attachControl(canvas, true);
      camera.minZ = 0.01;
      camera.lowerRadiusLimit = 0.2;
      camera.upperRadiusLimit = 30;

      // Lights
      new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
      const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-0.5, -1, -0.8), scene);
      dirLight.intensity = 1.1;

      // Environment
      const env = BABYLON.CubeTexture.CreateFromPrefilteredData(
        "https://assets.babylonjs.com/environments/studio.env",
        scene
      );
      scene.environmentTexture = env;
      scene.environmentIntensity = 1.0;

      // Load Knife
      try {
        const result = await BABYLON.SceneLoader.ImportMeshAsync(
          "", 
          "https://dragontein.github.io/PublicShare/", 
          "Shield.babylon", 
          scene
        );

        // Get ALL meshes (important for correct bounding box)
        const allMeshes = result.meshes.filter(m => m.isVisible !== false && m.getTotalVertices() > 0);
        
        if (allMeshes.length === 0) {
          console.error("No visible meshes found");
          return;
        }

        // Create a parent for easier manipulation if needed
        const root = new BABYLON.TransformNode("knifeRoot", scene);
        allMeshes.forEach(mesh => {
          if (mesh.parent === null) {
            mesh.parent = root;
          }
        });

        // Compute proper bounding box from all geometry
        const boundingInfo = BABYLON.Mesh.MergeMeshes(allMeshes, true, true, undefined, false, true)?.getBoundingInfo() 
                          || allMeshes[0].getBoundingInfo();

        const center = boundingInfo.boundingBox.centerWorld;
        const size = boundingInfo.boundingBox.extendSize.scale(2);
        const maxDim = Math.max(size.x, size.y, size.z);

        // Center camera on geometry, not pivot
        camera.setTarget(center);
        camera.radius = maxDim * 1.8;

        console.log("Knife loaded successfully. Bounding size:", maxDim);

      } catch (err) {
        console.error("Failed to load Knife.babylon:", err);
      }

      engine.runRenderLoop(() => scene.render());
      window.addEventListener("resize", () => engine.resize());
    });
  </script>
</body>
</html>
